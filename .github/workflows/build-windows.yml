name: windows build

# Builds the bundled Windows program (~150 MB) and tests it. This is the slow
# check, so it only runs when something that affects the bundle changes:
#   - on a PR or on main, when packaging, dependencies, the updater/installer,
#     the self-test or this workflow change;
#   - on demand: Actions > windows build > Run workflow (pick any branch);
#   - as part of every release (release.yml calls it).
# It never publishes anything itself; release.yml does that.

on:
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
      - "pcd_merge/updater.py"
      - "pcd_merge/startup.py"
      - "pcd_merge/selftest.py"
      - "pcd_merge/cli.py"
      - "pcd_merge/__main__.py"
      - "pcd_merge/gpu.py"
      - "pcd_merge/benchmark.py"
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
      - "pcd_merge/updater.py"
      - "pcd_merge/startup.py"
      - "pcd_merge/selftest.py"
      - "pcd_merge/cli.py"
      - "pcd_merge/__main__.py"
      - "pcd_merge/gpu.py"
      - "pcd_merge/benchmark.py"
  workflow_dispatch:
    inputs:
      publish_test:
        description: "Also publish the program and GPU add-on as a test pre-release (installed copies ignore pre-releases)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version to stamp into the build (empty: keep pcd_merge/__init__.py)"
        type: string
        default: ""
    outputs:
      zip:
        description: "File name of the built zip (uploaded as an artifact of the same name)"
        value: ${{ jobs.build.outputs.zip }}
      addon_zip:
        description: "File name of the GPU add-on zip (uploaded as an artifact of the same name)"
        value: ${{ jobs.gpu-addon.outputs.zip }}

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Stamp release version
        if: inputs.version != ''
        shell: bash
        run: sed -i -E 's/^__version__ = .*/__version__ = "${{ inputs.version }}"/' pcd_merge/__init__.py

      # Open3D, PySide6, PyInstaller etc. are cached as a whole environment and
      # only reinstalled when pyproject.toml / requirements.txt change.
      - name: Restore Python environment
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-build-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
      - name: Install dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/pip install ".[build]"
      - name: Install this version of the package
        shell: bash
        run: .venv/Scripts/pip install --no-deps --force-reinstall .

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(.venv/Scripts/python -c 'import pcd_merge; print(pcd_merge.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: .venv/Scripts/pyinstaller --noconfirm packaging/pcd_merge.spec

      - name: Self-test the built program
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "pcd-merge-selftest.log"
          $p = Start-Process -FilePath "dist\PCD Merge\PCD Merge.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Test update swap and shortcuts
        shell: bash
        run: .venv/Scripts/python packaging/ci_windows_check.py "dist/PCD Merge"

      - name: Zip
        id: zip
        shell: bash
        run: |
          name="PCD-Merge-${{ steps.version.outputs.version }}-windows-x64.zip"
          cd dist && 7z a -tzip -mx=7 "../$name" "PCD Merge" > /dev/null && cd ..
          ls -la "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          retention-days: 14

  # Optional NVIDIA GPU support (CuPy + CUDA runtime/NVRTC DLLs), ~180 MB, kept
  # out of the main zip. Users unzip it into %LOCALAPPDATA%\PCD Merge\ (it
  # holds a "gpu" folder). The runner has no GPU, so the test only checks that
  # the bundled program can load it and reports "no NVIDIA GPU".
  gpu-addon:
    needs: build
    runs-on: windows-latest
    outputs:
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.zip }}
      - name: Unpack the program
        shell: bash
        run: 7z x -y "${{ needs.build.outputs.zip }}" -oapp > /dev/null
      - name: Build the add-on
        shell: bash
        run: |
          mkdir -p gpu/site gpu/cuda/bin wheels
          # Python packages, without numpy: the program brings its own.
          python -m pip install --no-deps --target gpu/site \
            "cupy-cuda12x==14.*" "cuda-pathfinder==1.*" fastrlock
          # CUDA runtime and NVRTC (CuPy compiles its kernels at run time).
          python -m pip download --no-deps --only-binary=:all: -d wheels \
            --platform win_amd64 "nvidia-cuda-runtime-cu12==12.*" "nvidia-cuda-nvrtc-cu12==12.*"
          for w in wheels/*.whl; do 7z x -y "$w" -owheels/x > /dev/null; done
          find wheels/x -name "*.dll" -exec cp {} gpu/cuda/bin/ \;
          rm -rf gpu/site/bin gpu/site/*.dist-info/RECORD
          ls gpu/cuda/bin
          du -sh gpu
      - name: Check the program loads the add-on
        shell: pwsh
        run: |
          Copy-Item -Recurse gpu "app\PCD Merge\gpu"
          $log = Join-Path $env:TEMP "pcd-merge-gpu.log"
          $p = Start-Process -FilePath "app\PCD Merge\PCD Merge.exe" -ArgumentList "--gpu-info" -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "--gpu-info failed with exit code $($p.ExitCode)" }
          $text = Get-Content $log -Raw
          if ($text -match "could not be loaded|add-on not installed") { throw "the program could not load the GPU add-on" }
      - name: Zip
        id: zip
        shell: bash
        run: |
          # no "windows" in the name: older installed copies pick the first "windows*.zip"
          # asset of a release as the program itself
          name="PCD-Merge-GPU-addon-x64.zip"
          7z a -tzip -mx=7 "$name" gpu > /dev/null
          ls -la "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          retention-days: 14

  # Run by hand (Run workflow, tick "publish_test") to get public download
  # links for trying a branch, e.g. the GPU benchmark on a real NVIDIA PC.
  # Pre-releases are not offered as updates to installed copies.
  test-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test
    needs: [build, gpu-addon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.zip }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gpu-addon.outputs.zip }}
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "Test build: $GITHUB_REF_NAME (#$GITHUB_RUN_NUMBER)" \
            --notes "Test build of branch $GITHUB_REF_NAME, not an update. Delete when done." \
            "${{ needs.build.outputs.zip }}" "${{ needs.gpu-addon.outputs.zip }}"
